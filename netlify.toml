# Persiapan lokal saja. Jangan hubungkan repo/site atau deploy tanpa izin pemilik.
# Gunakan project Netlify BARU, bukan site utama xyroplay.web.id.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
